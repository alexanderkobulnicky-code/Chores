<!doctype html>

<html lang="en">

<head>

<meta charset="utf-8">

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="theme-color" content="#f4f4ef">

<title>Chores</title>

<link rel="manifest" href="manifest.webmanifest">

<style>

:root{

  --bg:#f4f4ef;

  --card:#fff;

  --ink:#1d221f;

  --muted:#6d756f;

  --line:#dfe3dd;

  --green:#315f4a;

  --amber:#8a5b16;

  --red:#8d3d37

}

*{box-sizing:border-box}

body{

  margin:0;

  background:var(--bg);

  color:var(--ink);

  font-family:system-ui,-apple-system,sans-serif

}

.app{max-width:800px;margin:auto;padding:22px 16px 50px}

header,.top,.row,.bottom{

  display:flex;

  justify-content:space-between;

  align-items:center;

  gap:12px

}

h1{font-size:42px;margin:0}

.muted{color:var(--muted);font-size:14px}

button,select,input{font:inherit}

.add,.save{

  border:0;

  border-radius:999px;

  background:var(--ink);

  color:white;

  padding:11px 15px;

  font-weight:700

}

.top,.task{

  background:var(--card);

  border:1px solid var(--line);

  border-radius:18px;

  padding:18px;

  margin:14px 0

}

.top h2{margin:0;font-size:27px}

.tasks{display:grid;gap:11px}

.task{margin:0}

.name{font-size:20px;font-weight:750}

.bar{

  height:8px;

  background:#e9ece8;

  border-radius:99px;

  overflow:hidden;

  margin:14px 0

}

.bar i{

  display:block;

  height:100%;

  background:var(--green)

}

.pending .bar i,.due .bar i{background:var(--amber)}

.overdue{border-color:#e3b5b1}

.overdue .bar i{background:var(--red)}

.bottom{font-size:12px;color:var(--muted)}

.edit{

  border:0;

  background:none;

  text-decoration:underline

}

.switch{position:relative;width:62px;height:34px}

.switch input{opacity:0}

.switch span{

  position:absolute;

  inset:0;

  background:#cfd4cf;

  border-radius:99px

}

.switch span:before{

  content:"";

  position:absolute;

  width:26px;

  height:26px;

  left:4px;

  top:4px;

  background:white;

  border-radius:50%;

  transition:.2s;

  box-shadow:0 2px 6px #0002

}

.switch input:checked+span{background:var(--green)}

.switch input:checked+span:before{transform:translateX(28px)}

dialog{

  border:0;

  border-radius:20px;

  width:min(520px,calc(100% - 24px));

  padding:0;

  box-shadow:0 25px 80px #0004

}

dialog::backdrop{background:#0004}

.modal{padding:21px}

.field{display:grid;gap:6px;margin:12px 0}

.field label{

  font-size:13px;

  color:var(--muted);

  font-weight:700

}

.pair{

  display:grid;

  grid-template-columns:1fr 1fr;

  gap:10px

}

input,select{

  width:100%;

  padding:11px;

  border:1px solid var(--line);

  border-radius:11px;

  background:white

}

.actions{

  display:flex;

  justify-content:space-between;

  margin-top:18px

}

.ghost,.del{

  border:1px solid var(--line);

  border-radius:999px;

  padding:10px 13px;

  background:white

}

.del{color:var(--red)}

.fine{

  font-size:12px;

  color:var(--muted);

  line-height:1.4

}

@media(max-width:520px){

  h1{font-size:36px}

  .pair{grid-template-columns:1fr}

}

</style>

</head>

<body>

<main class="app">

<header>

  <div>

    <h1>Chores</h1>

    <div class="muted" id="date"></div>

  </div>

  <button class="add" id="add">＋ Add task</button>

</header>

<section class="top">

  <div>

    <h2 id="headline">No tasks due</h2>

    <div class="muted" id="summary">The field is clear.</div>

  </div>

  <strong id="count">✓</strong>

</section>

<section class="tasks" id="tasks"></section>

</main>

<dialog id="dlg">

<form class="modal" id="form">

<h2 id="title">Add task</h2>

<input type="hidden" id="tid">

<div class="field">

<label>Task</label>

<input id="nm" required>

</div>

<div class="pair">

<div class="field">

<label>Reset after</label>

<input id="iv" type="number" min=".25" step=".25" value="1">

</div>

<div class="field">

<label>Unit</label>

<select id="iu">

<option value="hours">Hours</option>

<option value="days" selected>Days</option>

<option value="weeks">Weeks</option>

</select>

</div>

</div>

<div class="field">

<label>Recurrence</label>

<select id="mode">

<option value="scheduled">Scheduled — keep cadence</option>

<option value="since">Since completion — restart timer</option>

</select>

</div>

<div class="pair">

<div class="field">

<label>Reset to Pending</label>

<input id="lv" type="number" min="0" step=".25" value="6">

</div>

<div class="field">

<label>Unit</label>

<select id="lu">

<option value="hours" selected>Hours</option>

<option value="days">Days</option>

<option value="weeks">Weeks</option>

</select>

</div>

</div>

<div class="pair">

<div class="field">

<label>Grace period</label>

<input id="gv" type="number" min="0" step=".25" value="6">

</div>

<div class="field">

<label>Unit</label>

<select id="gu">

<option value="hours" selected>Hours</option>

<option value="days">Days</option>

<option value="weeks">Weeks</option>

</select>

</div>

</div>

<p class="fine">

Done → Pending when the lead window opens → Due at the scheduled time →

Overdue after the grace period. Scheduled chores keep their cadence when

completed early.

</p>

<div class="actions">

<button type="button" class="del" id="del" hidden>Delete</button>

<div>

<button type="button" class="ghost" id="cancel">Cancel</button>

<button class="save">Save</button>

</div>

</div>

</form>

</dialog>

<script>

const K="chores-app-v1";

const M={

  hours:3600000,

  days:86400000,

  weeks:604800000

};

const $=x=>document.getElementById(x);

const uid=()=>crypto.randomUUID();

function mk(n,i,u,g,gu,l,lu,m="scheduled"){

  return{

    id:uid(),

    name:n,

    intervalValue:i,

    intervalUnit:u,

    intervalMs:i*M[u],

    graceValue:g,

    graceUnit:gu,

    graceMs:g*M[gu],

    leadValue:l,

    leadUnit:lu,

    leadMs:l*M[lu],

    mode:m,

    doneAt:null,

    dueAt:null,

    streak:0,

    best:0,

    total:0,

    createdAt:Date.now()

  };

}

let S;

try{

  S=JSON.parse(localStorage.getItem(K));

}catch(e){}

if(!S||!Array.isArray(S.tasks)){

  S={

    tasks:[

      mk("Shave",1,"days",6,"hours",8,"hours"),

      mk("Laundry",1,"weeks",1,"days",2,"days"),

      mk("Wash hair",3,"days",12,"hours",1,"days"),

      mk("Trim fingernails",2,"weeks",2,"days",3,"days")

    ]

  };

}

for(const t of S.tasks){

  t.mode=t.mode||t.recurrenceMode||"scheduled";

  if(t.streak==null)

    t.streak=t.currentStreak||0;

  if(t.best==null)

    t.best=t.bestStreak||0;

  if(t.total==null)

    t.total=t.totalCompletions||0;

  if(t.dueAt===undefined)

    t.dueAt=t.doneAt?t.doneAt+t.intervalMs:null;

  if(t.leadMs===undefined){

    t.leadValue=0;

    t.leadUnit="hours";

    t.leadMs=0;

  }

}

const save=()=>localStorage.setItem(K,JSON.stringify(S));

function st(t,n=Date.now()){

  if(!t.doneAt)

    return{q:"pending",r:0,x:0};

  let d=t.dueAt||t.doneAt+t.intervalMs;

  let p=d-t.leadMs;

  let o=d+t.graceMs;

  if(n<p)

    return{

      q:"done",

      r:1-(n-(d-t.intervalMs))/Math.max(1,p-(d-t.intervalMs)),

      x:p-n

    };

  if(n<d)

    return{

      q:"pending",

      r:(d-n)/Math.max(1,t.leadMs),

      x:d-n

    };

  if(n<o)

    return{

      q:"due",

      r:t.graceMs?1-(n-d)/t.graceMs:0,

      x:o-n

    };

  return{

    q:"overdue",

    r:0,

    x:n-o

  };

}

function dur(x){

  let h=Math.abs(x)/M.hours;

  let d=Math.abs(x)/M.days;

  if(h<1)

    return Math.max(1,Math.round(Math.abs(x)/60000))+" min";

  if(h<24)

    return Math.round(h)+" hr";

  if(d<14){

    let z=Math.round(d);

    return z+" day"+(z==1?"":"s");

  }

  let w=Math.round(d/7);

  return w+" week"+(w==1?"":"s");

}

function text(t){

  let s=st(t);

  if(!t.doneAt)

    return "Pending — not yet completed";

  if(s.q=="done")

    return "Done · pending in "+dur(s.x);

  if(s.q=="pending")

    return "Pending · due in "+dur(s.x);

  if(s.q=="due")

    return "Due now · grace ends in "+dur(s.x);

  return "Overdue by "+dur(s.x);

}

function mark(t,on){

  let before=st(t).q;

  let n=Date.now();

  if(on){

    if(t.mode=="since"){

      t.dueAt=n+t.intervalMs;

    }else{

      if(!t.dueAt)

        t.dueAt=n+t.intervalMs;

      while(t.dueAt<=n)

        t.dueAt+=t.intervalMs;

    }

    t.doneAt=n;

    t.total++;

    t.streak=before=="overdue"?1:t.streak+1;

    t.best=Math.max(t.best,t.streak);

  }else{

    t.doneAt=null;

    if(t.mode=="since")

      t.dueAt=null;

  }

  save();

  render();

}

function safeName(s){

  return s

    .replaceAll("&","&amp;")

    .replaceAll("<","&lt;");

}

function render(){

  $("date").textContent=

    new Intl.DateTimeFormat(

      undefined,

      {weekday:"long",month:"long",day:"numeric"}

    ).format(new Date());

  $("tasks").innerHTML="";

  let rank={

    overdue:0,

    due:1,

    pending:2,

    done:3

  };

  let a=[...S.tasks].sort(

    (x,y)=>rank[st(x).q]-rank[st(y).q]

  );

  for(const t of a){

    let s=st(t);

    let e=document.createElement("article");

    e.className="task "+s.q;

    e.innerHTML=

      '<div class="row">'+

        '<div>'+

          '<div class="name">'+safeName(t.name)+'</div>'+

          '<div class="muted">'+text(t)+'</div>'+

        '</div>'+

        '<label class="switch">'+

          '<input type="checkbox" '+(s.q=="done"?"checked":"")+'>'+

          '<span></span>'+

        '</label>'+

      '</div>'+

      '<div class="bar">'+

        '<i style="width:'+

        Math.max(0,Math.min(100,s.r*100))+

        '%"></i>'+

      '</div>'+

      '<div class="bottom">'+

        '<span>Streak '+t.streak+

        ' · Best '+t.best+

        ' · Total '+t.total+

        '</span>'+

        '<button class="edit">Edit</button>'+

      '</div>';

    e.querySelector("input").onchange=

      x=>mark(t,x.target.checked);

    e.querySelector(".edit").onclick=

      ()=>edit(t);

    $("tasks").appendChild(e);

  }

  let q=S.tasks.map(st);

  let o=q.filter(x=>x.q=="overdue").length;

  let d=q.filter(x=>x.q=="due").length;

  let p=q.filter(x=>x.q=="pending").length;

  if(o){

    $("headline").textContent=

      o+" task"+(o==1?"":"s")+" overdue";

    $("summary").textContent=

      (d+p)

      ?(d+p)+" more waiting."

      :"Nothing else is waiting.";

    $("count").textContent=o;

  }else if(d){

    $("headline").textContent=

      d+" task"+(d==1?"":"s")+" due";

    $("summary").textContent=

      p

      ?p+" more pending."

      :"Nothing is overdue.";

    $("count").textContent=d;

  }else{

    $("headline").textContent="No tasks due";

    $("summary").textContent=

      p

      ?p+" task"+(p==1?" is":"s are")+" pending."

      :"The field is clear.";

    $("count").textContent="✓";

  }

}

$("add").onclick=()=>{

  $("form").reset();

  $("tid").value="";

  $("title").textContent="Add task";

  $("del").hidden=true;

  $("dlg").showModal();

};

$("cancel").onclick=()=>$("dlg").close();

function edit(t){

  $("tid").value=t.id;

  $("title").textContent="Edit task";

  $("nm").value=t.name;

  $("iv").value=t.intervalValue;

  $("iu").value=t.intervalUnit;

  $("mode").value=t.mode;

  $("lv").value=t.leadValue||0;

  $("lu").value=t.leadUnit||"hours";

  $("gv").value=t.graceValue;

  $("gu").value=t.graceUnit;

  $("del").hidden=false;

  $("dlg").showModal();

}

$("form").onsubmit=e=>{

  e.preventDefault();

  let t=S.tasks.find(x=>x.id==$("tid").value);

  let n=$("nm").value.trim();

  let i=+$("iv").value;

  let u=$("iu").value;

  let l=+$("lv").value;

  let lu=$("lu").value;

  let g=+$("gv").value;

  let gu=$("gu").value;

  let m=$("mode").value;

  if(!n||i<=0||l<0||g<0)

    return;

  if(t){

    Object.assign(t,{

      name:n,

      intervalValue:i,

      intervalUnit:u,

      intervalMs:i*M[u],

      leadValue:l,

      leadUnit:lu,

      leadMs:l*M[lu],

      graceValue:g,

      graceUnit:gu,

      graceMs:g*M[gu],

      mode:m

    });

  }else{

    S.tasks.push(

      mk(n,i,u,g,gu,l,lu,m)

    );

  }

  save();

  $("dlg").close();

  render();

};

$("del").onclick=()=>{

  let t=S.tasks.find(

    x=>x.id==$("tid").value

  );

  if(t&&confirm('Delete "'+t.name+'"?')){

    S.tasks=S.tasks.filter(

      x=>x.id!=t.id

    );

    save();

    $("dlg").close();

    render();

  }

};

save();

render();

setInterval(render,60000);

if("serviceWorker" in navigator)

  navigator.serviceWorker

    .register("./service-worker.js")

    .catch(()=>{});

</script>

</body>

</html>
