<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f4f4ef" />
  <title>Chores</title>
  <link rel="manifest" href="manifest.webmanifest">
  <style>
    :root{
      --bg:#f4f4ef;
      --panel:#ffffff;
      --ink:#1d221f;
      --muted:#6d756f;
      --line:#dfe3dd;
      --accent:#315f4a;
      --accent-soft:#dfece5;
      --warn:#8a5b16;
      --warn-soft:#f5ead5;
      --danger:#8d3d37;
      --danger-soft:#f5dfdd;
      --shadow:0 10px 30px rgba(23,33,27,.07);
      --radius:18px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      background:var(--bg);
      color:var(--ink);
      font-family:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height:100vh;
    }
    button,input,select{font:inherit}
    .shell{
      width:min(860px,100%);
      margin:0 auto;
      padding:24px 18px 56px;
    }
    header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:16px;
      margin-bottom:18px;
    }
    h1{
      margin:0;
      font-size:clamp(30px,6vw,48px);
      letter-spacing:-.045em;
      font-weight:760;
    }
    .subtle{
      color:var(--muted);
      font-size:14px;
      margin-top:4px;
    }
    .icon-btn,.primary-btn,.ghost-btn,.danger-btn{
      border:0;
      border-radius:999px;
      cursor:pointer;
      transition:.18s ease;
    }
    .primary-btn{
      background:var(--ink);
      color:white;
      padding:12px 17px;
      font-weight:700;
    }
    .primary-btn:hover{transform:translateY(-1px)}
    .ghost-btn{
      background:transparent;
      color:var(--ink);
      padding:10px 12px;
      border:1px solid var(--line);
    }
    .danger-btn{
      background:var(--danger-soft);
      color:var(--danger);
      padding:10px 12px;
      font-weight:700;
    }
    .status-card{
      background:var(--panel);
      border:1px solid var(--line);
      border-radius:var(--radius);
      padding:22px;
      box-shadow:var(--shadow);
      margin-bottom:18px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:18px;
    }
    .status-title{
      font-size:clamp(22px,4vw,32px);
      font-weight:760;
      letter-spacing:-.03em;
      margin:0;
    }
    .status-copy{margin-top:5px;color:var(--muted)}
    .status-badge{
      min-width:58px;
      height:58px;
      border-radius:50%;
      display:grid;
      place-items:center;
      background:var(--accent-soft);
      color:var(--accent);
      font-weight:800;
      font-size:20px;
    }
    .toolbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin:16px 0 10px;
    }
    .toolbar h2{font-size:15px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:0}
    .sort-select{
      background:transparent;
      border:1px solid var(--line);
      border-radius:999px;
      padding:9px 12px;
      color:var(--ink);
    }
    .task-list{
      display:grid;
      gap:12px;
    }
    .task{
      background:var(--panel);
      border:1px solid var(--line);
      border-radius:var(--radius);
      padding:18px;
      box-shadow:0 4px 18px rgba(23,33,27,.04);
    }
    .task-top{
      display:grid;
      grid-template-columns:1fr auto;
      gap:14px;
      align-items:center;
    }
    .task-name{
      font-size:20px;
      font-weight:750;
      letter-spacing:-.02em;
    }
    .task-meta{
      margin-top:4px;
      color:var(--muted);
      font-size:14px;
      line-height:1.35;
    }
    .switch{
      position:relative;
      width:64px;
      height:34px;
      display:inline-block;
      flex:0 0 auto;
    }
    .switch input{opacity:0;width:0;height:0}
    .slider{
      position:absolute;inset:0;
      background:#cfd4cf;
      border-radius:999px;
      cursor:pointer;
      transition:.2s;
    }
    .slider::before{
      content:"";
      position:absolute;
      width:26px;height:26px;
      left:4px;top:4px;
      background:white;
      border-radius:50%;
      box-shadow:0 2px 7px rgba(0,0,0,.16);
      transition:.2s;
    }
    .switch input:checked + .slider{background:var(--accent)}
    .switch input:checked + .slider::before{transform:translateX(30px)}
    .progress{
      height:8px;
      background:#e9ece8;
      border-radius:999px;
      overflow:hidden;
      margin-top:15px;
    }
    .progress > div{
      height:100%;
      width:0;
      background:var(--accent);
      border-radius:inherit;
      transition:width .25s ease;
    }
    .task-bottom{
      margin-top:12px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      flex-wrap:wrap;
    }
    .stats{
      display:flex;
      gap:14px;
      flex-wrap:wrap;
      color:var(--muted);
      font-size:13px;
    }
    .edit-link{
      border:0;background:transparent;color:var(--ink);
      text-decoration:underline;
      text-underline-offset:3px;
      cursor:pointer;
      padding:0;
    }
    .state-due .progress > div{background:var(--warn)}
    .state-overdue{border-color:#e5bbb8}
    .state-overdue .progress > div{background:var(--danger)}
    .empty{
      text-align:center;
      padding:40px 20px;
      color:var(--muted);
      border:1px dashed var(--line);
      border-radius:var(--radius);
    }
    dialog{
      width:min(520px,calc(100% - 28px));
      border:0;
      border-radius:22px;
      padding:0;
      box-shadow:0 28px 90px rgba(0,0,0,.25);
    }
    dialog::backdrop{background:rgba(20,25,22,.35);backdrop-filter:blur(3px)}
    .modal{
      padding:22px;
      background:white;
    }
    .modal h3{margin:0 0 18px;font-size:26px;letter-spacing:-.03em}
    .field{display:grid;gap:7px;margin:14px 0}
    .field label{font-size:13px;font-weight:700;color:var(--muted)}
    .field input,.field select{
      width:100%;
      border:1px solid var(--line);
      border-radius:12px;
      padding:12px 13px;
      background:white;
      color:var(--ink);
    }
    .inline-fields{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
    }
    .modal-actions{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      margin-top:20px;
    }
    .modal-actions-right{display:flex;gap:8px}
    .fineprint{
      color:var(--muted);
      font-size:12px;
      line-height:1.45;
      margin-top:10px;
    }
    .toast{
      position:fixed;
      left:50%;
      bottom:24px;
      transform:translateX(-50%) translateY(20px);
      background:var(--ink);
      color:white;
      padding:11px 15px;
      border-radius:999px;
      opacity:0;
      pointer-events:none;
      transition:.2s;
      z-index:50;
      font-size:14px;
    }
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    @media (max-width:560px){
      .shell{padding-top:18px}
      header{align-items:flex-start}
      .status-card{align-items:flex-start}
      .status-badge{min-width:48px;height:48px}
      .inline-fields{grid-template-columns:1fr}
      .task{padding:16px}
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div>
        <h1>Chores</h1>
        <div class="subtle" id="todayLabel"></div>
      </div>
      <button class="primary-btn" id="addTaskBtn">＋ Add task</button>
    </header>

    <section class="status-card" id="statusCard" aria-live="polite">
      <div>
        <p class="status-title" id="statusTitle">No tasks due</p>
        <div class="status-copy" id="statusCopy">The field is clear.</div>
      </div>
      <div class="status-badge" id="statusBadge">✓</div>
    </section>

    <div class="toolbar">
      <h2>Your tasks</h2>
      <select id="sortSelect" class="sort-select" aria-label="Sort tasks">
        <option value="urgency">Sort: urgency</option>
        <option value="manual">Sort: added order</option>
        <option value="name">Sort: name</option>
      </select>
    </div>

    <section class="task-list" id="taskList"></section>
  </main>

  <dialog id="taskDialog">
    <form method="dialog" class="modal" id="taskForm">
      <h3 id="dialogTitle">Add task</h3>
      <input type="hidden" id="taskId">

      <div class="field">
        <label for="taskName">Task</label>
        <input id="taskName" required maxlength="80" placeholder="e.g. Shave">
      </div>

      <div class="inline-fields">
        <div class="field">
          <label for="intervalValue">Reset after</label>
          <input id="intervalValue" type="number" min="0.25" step="0.25" value="1" required>
        </div>
        <div class="field">
          <label for="intervalUnit">Unit</label>
          <select id="intervalUnit">
            <option value="hours">Hours</option>
            <option value="days" selected>Days</option>
            <option value="weeks">Weeks</option>
          </select>
        </div>
      </div>

      <div class="inline-fields">
        <div class="field">
          <label for="graceValue">Grace period</label>
          <input id="graceValue" type="number" min="0" step="0.25" value="6">
        </div>
        <div class="field">
          <label for="graceUnit">Unit</label>
          <select id="graceUnit">
            <option value="hours" selected>Hours</option>
            <option value="days">Days</option>
          </select>
        </div>
      </div>

      <div class="fineprint">A task becomes pending when its interval elapses. Its streak breaks only after the grace period also elapses.</div>

      <div class="modal-actions">
        <button type="button" class="danger-btn" id="deleteBtn" hidden>Delete</button>
        <div class="modal-actions-right">
          <button value="cancel" class="ghost-btn">Cancel</button>
          <button value="default" class="primary-btn" id="saveBtn">Save</button>
        </div>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast"></div>

<script>
const STORAGE_KEY = "chores-app-v1";
const MS = { hours: 3600000, days: 86400000, weeks: 604800000 };

const defaultTasks = [
  makeTask("Shave", 1, "days", 6, "hours"),
  makeTask("Laundry", 1, "weeks", 1, "days"),
  makeTask("Wash hair", 3, "days", 12, "hours"),
  makeTask("Trim fingernails", 2, "weeks", 2, "days")
];

function makeTask(name, intervalValue, intervalUnit, graceValue, graceUnit){
  return {
    id: crypto.randomUUID(),
    name,
    intervalMs: intervalValue * MS[intervalUnit],
    graceMs: graceValue * MS[graceUnit],
    intervalValue, intervalUnit, graceValue, graceUnit,
    doneAt: null,
    currentStreak: 0,
    bestStreak: 0,
    totalCompletions: 0,
    streakBrokenForCycle: false,
    createdAt: Date.now()
  };
}

let state = loadState();

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      if(Array.isArray(parsed.tasks)) return parsed;
    }
  }catch(e){}
  return { tasks: defaultTasks, sort: "urgency" };
}

function saveState(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function taskStatus(task, now = Date.now()){
  if(!task.doneAt){
    return { state:"pending", ratio:0, dueAt:null, overdueAt:null, msUntil:0 };
  }
  const dueAt = task.doneAt + task.intervalMs;
  const overdueAt = dueAt + task.graceMs;
  if(now < dueAt){
    const elapsed = now - task.doneAt;
    return {state:"done", ratio:Math.max(0,1-elapsed/task.intervalMs), dueAt, overdueAt, msUntil:dueAt-now};
  }
  if(now < overdueAt){
    const ratio = task.graceMs ? Math.max(0,1-(now-dueAt)/task.graceMs) : 0;
    return {state:"due", ratio, dueAt, overdueAt, msUntil:overdueAt-now};
  }
  return {state:"overdue", ratio:0, dueAt, overdueAt, msUntil:now-overdueAt};
}

function reconcileStreaks(){
  let changed = false;
  for(const task of state.tasks){
    const s = taskStatus(task);
    if(s.state === "overdue" && task.doneAt && !task.streakBrokenForCycle){
      task.currentStreak = 0;
      task.streakBrokenForCycle = true;
      changed = true;
    }
  }
  if(changed) saveState();
}

function fmtDuration(ms){
  const abs = Math.abs(ms);
  const hours = abs / MS.hours;
  const days = abs / MS.days;
  if(hours < 1) return `${Math.max(1, Math.round(abs/60000))} min`;
  if(hours < 24) return `${Math.round(hours)} hr`;
  if(days < 14) return `${Math.round(days)} day${Math.round(days)===1?"":"s"}`;
  const weeks = Math.round(days/7);
  return `${weeks} week${weeks===1?"":"s"}`;
}

function describe(task){
  const s = taskStatus(task);
  if(!task.doneAt) return "Pending — not yet completed";
  if(s.state === "done") return `Done · due in ${fmtDuration(s.msUntil)}`;
  if(s.state === "due") return `Due now · grace ends in ${fmtDuration(s.msUntil)}`;
  return `Overdue by ${fmtDuration(s.msUntil)}`;
}

function sortTasks(tasks){
  const copied = [...tasks];
  if(state.sort === "name") return copied.sort((a,b)=>a.name.localeCompare(b.name));
  if(state.sort === "manual") return copied.sort((a,b)=>a.createdAt-b.createdAt);
  const rank = {overdue:0,due:1,pending:2,done:3};
  return copied.sort((a,b)=>{
    const sa = taskStatus(a), sb = taskStatus(b);
    if(rank[sa.state] !== rank[sb.state]) return rank[sa.state]-rank[sb.state];
    if(sa.state === "done") return sa.msUntil-sb.msUntil;
    return a.createdAt-b.createdAt;
  });
}

function render(){
  reconcileStreaks();
  document.getElementById("todayLabel").textContent = new Intl.DateTimeFormat(undefined,{
    weekday:"long", month:"long", day:"numeric"
  }).format(new Date());

  const list = document.getElementById("taskList");
  list.innerHTML = "";

  const tasks = sortTasks(state.tasks);
  if(!tasks.length){
    list.innerHTML = `<div class="empty">No tasks yet. Add one when something begins nagging at you.</div>`;
  }

  for(const task of tasks){
    const s = taskStatus(task);
    const article = document.createElement("article");
    article.className = `task state-${s.state}`;
    article.innerHTML = `
      <div class="task-top">
        <div>
          <div class="task-name">${escapeHtml(task.name)}</div>
          <div class="task-meta">${describe(task)}</div>
        </div>
        <label class="switch" title="Mark ${task.name} done or pending">
          <input type="checkbox" ${s.state==="done" ? "checked" : ""} aria-label="Mark ${escapeHtml(task.name)} done">
          <span class="slider"></span>
        </label>
      </div>
      <div class="progress" aria-hidden="true"><div style="width:${Math.round(s.ratio*100)}%"></div></div>
      <div class="task-bottom">
        <div class="stats">
          <span>Streak ${task.currentStreak}</span>
          <span>Best ${task.bestStreak}</span>
          <span>Total ${task.totalCompletions}</span>
        </div>
        <button class="edit-link">Edit</button>
      </div>`;
    article.querySelector("input").addEventListener("change", e => {
      setDone(task.id, e.target.checked);
    });
    article.querySelector(".edit-link").addEventListener("click",()=>openEdit(task.id));
    list.appendChild(article);
  }

  updateGlobalStatus();
}

function updateGlobalStatus(){
  const statuses = state.tasks.map(t=>taskStatus(t).state);
  const overdue = statuses.filter(s=>s==="overdue").length;
  const due = statuses.filter(s=>s==="due" || s==="pending").length;
  const title = document.getElementById("statusTitle");
  const copy = document.getElementById("statusCopy");
  const badge = document.getElementById("statusBadge");

  if(overdue){
    title.textContent = `${overdue} task${overdue===1?"":"s"} overdue`;
    copy.textContent = due ? `${due} more currently due.` : "Nothing else is waiting.";
    badge.textContent = overdue;
    badge.style.background = "var(--danger-soft)";
    badge.style.color = "var(--danger)";
  }else if(due){
    title.textContent = `${due} task${due===1?"":"s"} due`;
    copy.textContent = "Nothing is overdue.";
    badge.textContent = due;
    badge.style.background = "var(--warn-soft)";
    badge.style.color = "var(--warn)";
  }else{
    title.textContent = "No tasks due";
    copy.textContent = "The field is clear.";
    badge.textContent = "✓";
    badge.style.background = "var(--accent-soft)";
    badge.style.color = "var(--accent)";
  }
}

function setDone(id, done){
  const task = state.tasks.find(t=>t.id===id);
  if(!task) return;
  if(done){
    const priorStatus = taskStatus(task).state;
    task.doneAt = Date.now();
    task.totalCompletions += 1;
    if(priorStatus !== "overdue"){
      task.currentStreak += 1;
    }else{
      task.currentStreak = 1;
    }
    task.bestStreak = Math.max(task.bestStreak, task.currentStreak);
    task.streakBrokenForCycle = false;
    toast(`${task.name} marked done`);
  }else{
    task.doneAt = null;
    task.streakBrokenForCycle = false;
    toast(`${task.name} marked pending`);
  }
  saveState();
  render();
}

const dialog = document.getElementById("taskDialog");
const form = document.getElementById("taskForm");

document.getElementById("addTaskBtn").addEventListener("click",()=>{
  form.reset();
  document.getElementById("taskId").value = "";
  document.getElementById("dialogTitle").textContent = "Add task";
  document.getElementById("intervalValue").value = 1;
  document.getElementById("intervalUnit").value = "days";
  document.getElementById("graceValue").value = 6;
  document.getElementById("graceUnit").value = "hours";
  document.getElementById("deleteBtn").hidden = true;
  dialog.showModal();
});

function openEdit(id){
  const task = state.tasks.find(t=>t.id===id);
  if(!task) return;
  document.getElementById("taskId").value = task.id;
  document.getElementById("dialogTitle").textContent = "Edit task";
  document.getElementById("taskName").value = task.name;
  document.getElementById("intervalValue").value = task.intervalValue;
  document.getElementById("intervalUnit").value = task.intervalUnit;
  document.getElementById("graceValue").value = task.graceValue;
  document.getElementById("graceUnit").value = task.graceUnit;
  document.getElementById("deleteBtn").hidden = false;
  dialog.showModal();
}

form.addEventListener("submit", e=>{
  e.preventDefault();
  const id = document.getElementById("taskId").value;
  const name = document.getElementById("taskName").value.trim();
  const intervalValue = Number(document.getElementById("intervalValue").value);
  const intervalUnit = document.getElementById("intervalUnit").value;
  const graceValue = Number(document.getElementById("graceValue").value);
  const graceUnit = document.getElementById("graceUnit").value;
  if(!name || intervalValue <= 0 || graceValue < 0) return;

  if(id){
    const task = state.tasks.find(t=>t.id===id);
    Object.assign(task,{
      name, intervalValue, intervalUnit, graceValue, graceUnit,
      intervalMs: intervalValue * MS[intervalUnit],
      graceMs: graceValue * MS[graceUnit]
    });
    toast("Task updated");
  }else{
    state.tasks.push(makeTask(name,intervalValue,intervalUnit,graceValue,graceUnit));
    toast("Task added");
  }
  saveState();
  dialog.close();
  render();
});

document.getElementById("deleteBtn").addEventListener("click",()=>{
  const id = document.getElementById("taskId").value;
  const task = state.tasks.find(t=>t.id===id);
  if(task && confirm(`Delete "${task.name}"?`)){
    state.tasks = state.tasks.filter(t=>t.id!==id);
    saveState();
    dialog.close();
    toast("Task deleted");
    render();
  }
});

document.getElementById("sortSelect").value = state.sort;
document.getElementById("sortSelect").addEventListener("change",e=>{
  state.sort = e.target.value;
  saveState();
  render();
});

function toast(message){
  const el = document.getElementById("toast");
  el.textContent = message;
  el.classList.add("show");
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=>el.classList.remove("show"),1400);
}

function escapeHtml(str){
  return str.replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c]));
}

render();
setInterval(render, 60000);

if("serviceWorker" in navigator){
  navigator.serviceWorker.register("./service-worker.js").catch(()=>{});
}
</script>
</body>
</html>
